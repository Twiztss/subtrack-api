name: Atlas MongoDB Connection Ping

on:
  schedule:
    # Runs at 00:00 UTC on Monday, Wednesday, and Friday (odd days of the week: 1, 3, 5)
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Atlas MongoDB Cluster
    runs-on: ubuntu-latest
    env:
      DB_URI: ${{ secrets.DB_URI }}
      MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_API_KEY }}
      MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_API_KEY }}
      MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Atlas CLI
        uses: mongodb/atlas-github-action@v0.2.0

      - name: Whitelist runner IP
        run: |
          RUNNER_IP=$(curl -s ifconfig.me)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          atlas accessLists create "$RUNNER_IP" \
            --type ipAddress \
            --comment "github-actions-cron-runner"
          echo "Whitelisted $RUNNER_IP — waiting for propagation..."
          sleep 10

      - name: Ping Atlas MongoDB cluster
        run: node utils/db-ping.js

      - name: Remove runner IP from whitelist
        if: always()
        run: atlas accessLists delete "$RUNNER_IP" --force
