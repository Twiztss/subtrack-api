name: Atlas MongoDB Connection Ping

on:
  schedule:
    # Runs at 00:00 UTC on Monday, Wednesday, and Friday (odd days of the week: 1, 3, 5)
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Atlas MongoDB Cluster
    runs-on: ubuntu-latest
    env:
      DB_URI: ${{ secrets.DB_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ping Atlas MongoDB cluster
        run: node utils/db-ping.js
